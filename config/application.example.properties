# Copy to application.properties. Environment variables override these values.
db.url=jdbc:mariadb://localhost:3306/idcardgen
db.user=
db.password=
# verify-full is enforced unless this explicit LOCAL development override is true.
db.allowInsecureLocal=false
# Separate Base64-encoded random 32-byte keys; never use the legacy aes_key.bin.
security.encryptionKey=
security.lookupKey=
session.idleMinutes=15
session.maxHours=8
institution.name=SoftSecure
institution.campus=Identity Services
# Original faculty student lookup is preserved but must be explicitly enabled.
privacy.facultyLookup=false
